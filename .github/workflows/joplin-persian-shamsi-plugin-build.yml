name: Joplin Persian Shamsi Plugin
# Dedicated build gate for the isolated Joplin plugin.
# Trigger: build artifact proof on plugin changes.
# Execution gate: produce and verify a real .jpl archive.

on:
  push:
    paths:
      - 'research/legacy-persian-shamsi-plugin/plugin/**'
      - '.github/workflows/joplin-persian-shamsi-plugin-build.yml'
  pull_request:
    paths:
      - 'research/legacy-persian-shamsi-plugin/plugin/**'
      - '.github/workflows/joplin-persian-shamsi-plugin-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/legacy-persian-shamsi-plugin/plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - name: Verify JPL archive
        run: |
          set -euo pipefail
          archive="$(find publish -maxdepth 1 -name '*.jpl' -print -quit)"
          test -n "$archive"
          tar -tf "$archive" | grep -Fx 'manifest.json'
          tar -tf "$archive" | grep -Fx 'index.js'
          tar -tf "$archive" | grep -Fx 'editorPlugin.js'
          tar -tf "$archive" | grep -Fx 'markdownItPlugin.js'
          tar -tf "$archive" | grep -Fx 'style.css'
          tar -tf "$archive" | grep -Fx 'editor.css'
          tar -tf "$archive" | grep -Fx 'fonts/Vazirharf[wght].ttf'
          tar -xOf "$archive" manifest.json | grep -F 'org.mobinpda.joplin.persianshamsi'
          tar -xOf "$archive" manifest.json | grep -Eq '"version"[[:space:]]*:[[:space:]]*"0\.1\.2"'
          tar -xOf "$archive" index.js | grep -F 'registerSettings'
          if tar -xOf "$archive" index.js | grep -F 'registerSetting('; then
            echo 'ERROR: deprecated registerSetting() remains in compiled plugin'
            exit 1
          fi
      - name: Upload JPL artifact
        uses: actions/upload-artifact@v4
        with:
          name: joplin-persian-shamsi-jpl
          path: research/legacy-persian-shamsi-plugin/plugin/publish/*.jpl
          if-no-files-found: error
